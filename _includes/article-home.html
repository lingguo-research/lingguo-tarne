<article class="home-blog-card">

  {% if post.tags %}
  <div class="home-blog-card__tags">
    {% assign shown_tags = 0 %}
    {% for tag in post.tags %}
      {% unless tag == "COSMIC" %}
        {% if shown_tags < 3 %}
          <span>{{ tag }}</span>
          {% assign shown_tags = shown_tags | plus: 1 %}
        {% endif %}
      {% endunless %}
    {% endfor %}
  </div>
  {% endif %}

  <h3 class="home-blog-card__title">
    <a href="{{ post.url | relative_url }}">
      {{ post.title }}
    </a>
  </h3>

</article>
